# --- Prefix ------------------------------------------------------------
set -g prefix C-s
unbind C-b
bind C-s send-prefix

# --- Mouse -------------------------------------------------------------
set -g mouse on

# --- Numbering ---------------------------------------------------------
set -g base-index 1
set -g renumber-windows on

# --- Neovim ------------------------------------------------------------
set -sg escape-time 0
set -g focus-events on

# --- Coloring ----------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -ag terminal-overrides ',*:cud1=\E[1B'

# --- Clipboard ---------------------------------------------------------
set -g set-clipboard on

# --- History -----------------------------------------------------------
set -g history-limit 10000

# --- Convenience -------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# --- Pane navigation with Ctrl+h/j/k/l (vim-tmux-navigator) -------------
# In a normal shell pane these move between tmux panes. If the pane runs
# Neovim (or fzf), the key is passed to it, and the Neovim plugin decides
# whether to move between Neovim splits or hand over to tmux.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
# Ctrl+l no longer clears the screen in shell panes; use <prefix> Ctrl+l instead.
bind C-l send-keys 'C-l'

# --- Status line (tokyo-night-tmux plugin) -----------------------------
set -g status-position top
set -g status-interval 5

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'janoamaral/tokyo-night-tmux'

set -g @tokyo-night-tmux_theme night
set -g @tokyo-night-tmux_transparent 0
set -g @tokyo-night-tmux_window_id_style none
set -g @tokyo-night-tmux_pane_id_style none
set -g @tokyo-night-tmux_zoom_id_style icon
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_date_format YMD
set -g @tokyo-night-tmux_time_format 24H
set -g @tokyo-night-tmux_show_git 0
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_show_music 0
set -g @tokyo-night-tmux_show_netspeed 0
set -g @tokyo-night-tmux_show_battery_widget 0

# set -g pane-border-style "fg=#292e42"
# set -g pane-active-border-style "fg=#7aa2f7"
# set -g message-style "bg=#16161e,fg=#7aa2f7"

# --- Plugin manager (keep at the very bottom) --------------------------
# Install plugins with <prefix> I, update with <prefix> U
run '~/.config/tmux/plugins/tpm/tpm'

# Angled separators like the Neovim (lualine) statusline.
# Must come after TPM so it can wrap the formats the plugin generated.
run '~/.config/tmux/separators.sh'
