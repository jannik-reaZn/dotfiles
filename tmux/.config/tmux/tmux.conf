# --- Mouse -------------------------------------------------------------
set -g mouse on

# --- Numbering ---------------------------------------------------------
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on

# --- Neovim ------------------------------------------------------------
set -sg escape-time 0
set -g focus-events on

# --- Coloring ----------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# --- Clipboard ---------------------------------------------------------
set -g set-clipboard on

# --- History -----------------------------------------------------------
set -g history-limit 10000

# --- Convenience -------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# --- Pane navigation with Ctrl+h/j/k/l (vim-tmux-navigator) -------------
# In a normal shell pane these move between tmux panes. If the pane runs
# Neovim (or fzf), the key is passed to it, and the Neovim plugin decides
# whether to move between Neovim splits or hand over to tmux.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
# Ctrl+l no longer clears the screen in shell panes; use <prefix> Ctrl+l instead.
bind C-l send-keys 'C-l'

# --- Status line (minimal, Tokyo Night) --------------------------------
# Palette: bg #16161e, fg #c0caf5, blue #7aa2f7, muted #565f89, line #292e42
set -g status-style "bg=#16161e,fg=#565f89"
set -g status-left-length 30
set -g status-left "#[fg=#7aa2f7,bold] #S  "
set -g status-right ""
set -g window-status-separator ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#c0caf5,bold] #I:#W "
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#16161e,fg=#7aa2f7"
